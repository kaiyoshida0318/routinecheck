<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RoutineCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --ink:#232E4F;
  --muted:#667085;
  --line:#DDE3EA;
  --off:#E3E8EE;        /* 土日祝の列 */
  --off-ink:#5B667A;
  --accent:#2A9C78;
  --accent-soft:#D4F0E5;
  --today:#4A90E2;
  --today-ink:#FFFFFF;
  --sat:#3A6FB8;
  --sun:#C0463E;
  --danger:#C0463E;
  --focus:#4A90E2;
  --catw:112px;
  --line2:#B9C3CF;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B;--surface:#181D25;--ink:#E8EDF4;--muted:#98A2B3;--line:#2A313C;
    --off:#0B0E13;--off-ink:#7D8797;--line2:#3D4757;--accent:#3FC49A;--accent-soft:#18372D;
    --today:#5AA2F0;--today-ink:#0B0E13;--sat:#83AEE8;--sun:#E88A82;--danger:#E88A82;--focus:#5AA2F0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B;--surface:#181D25;--ink:#E8EDF4;--muted:#98A2B3;--line:#2A313C;
  --off:#0B0E13;--off-ink:#7D8797;--line2:#3D4757;--accent:#3FC49A;--accent-soft:#18372D;
  --today:#5AA2F0;--today-ink:#0B0E13;--sat:#83AEE8;--sun:#E88A82;--danger:#E88A82;--focus:#5AA2F0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
header.top .monthnav{justify-self:center}
.brand{display:block;line-height:0}
.brand img{height:34px;width:auto;max-width:100%}
.brand .dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .lt{display:none}:root:not([data-theme="light"]) .brand .dk{display:inline}}
:root[data-theme="dark"] .brand .lt{display:none}
:root[data-theme="dark"] .brand .dk{display:inline}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav h1{font-size:24px;font-weight:700;margin:0 6px;min-width:6em;text-align:center;font-variant-numeric:tabular-nums;text-wrap:balance}
.monthnav h1 .y{font-family:var(--mono);font-weight:500;font-size:16px;color:var(--muted);margin-right:6px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.icon{width:34px;height:34px;padding:0;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
form.add{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 480px}
form.add input{flex:1 1 160px}
input[type=text],input[type=url]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
input::placeholder{color:var(--muted)}
.status{font-size:12px;color:var(--muted)}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:0;border-bottom:1px solid var(--line);text-align:center}
thead th{position:sticky;top:0;background:var(--surface);z-index:2}
.catcol{position:sticky;left:0;z-index:3;background:color-mix(in srgb,var(--hue) 7%,var(--surface));text-align:left;width:var(--catw);min-width:var(--catw);max-width:var(--catw);border-right:1px solid var(--line);padding:6px 8px;vertical-align:middle}
.namecol{position:sticky;left:var(--catw);z-index:3;background:var(--surface);text-align:left;width:200px;min-width:150px;max-width:240px;border-right:1px solid var(--line);padding:6px 12px}
thead .catcol{z-index:4;font-size:12px;color:var(--muted);font-weight:500;vertical-align:bottom;background:var(--surface)}
thead .namecol{z-index:4;font-size:12px;color:var(--muted);font-weight:500;vertical-align:bottom}
.dayh{min-width:30px;padding:6px 0 4px;line-height:1.15}
.dayh .n{display:block;font-family:var(--mono);font-size:13px;font-weight:500}
.dayh .w{display:block;font-size:10px;color:var(--muted)}
.off{background:var(--off)!important}
.dayh.off .n,.dayh.off .w{color:var(--off-ink)}
.dayh.sat .w{color:var(--sat)}
.dayh.sun .w,.dayh.hol .w{color:var(--sun)}
.dayh.hol .n{color:var(--sun)}
.dayh.today .n{background:var(--today);color:var(--today-ink);border-radius:5px;display:inline-block;padding:0 4px}
td.cell{height:38px}
td.cell.today{box-shadow:inset 1px 0 0 var(--today),inset -1px 0 0 var(--today)}
.chk{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);background:transparent;display:inline-grid;place-items:center;padding:0;transition:background .12s,border-color .12s}
.off .chk{border-color:color-mix(in srgb,var(--off-ink) 35%,transparent)}
.chk:hover{border-color:var(--accent)}
.chk svg{width:15px;height:15px;opacity:0}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"] svg{opacity:1}
.chk.future{opacity:.45}
.stat{position:sticky;right:0;background:var(--surface);width:64px;min-width:56px;padding:0 10px;font-family:var(--mono);font-size:12px;color:var(--muted);border-left:1px solid var(--line);white-space:nowrap}
thead .stat{z-index:4;font-family:var(--sans);font-weight:500;vertical-align:bottom;padding-bottom:6px}
.stat b{color:var(--ink);font-weight:500}
.iname{display:flex;align-items:center;gap:6px;min-width:0}
.iname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.iname a{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;color:var(--accent);text-decoration:none}
.iname a:hover{background:var(--accent-soft)}
.iname a svg{width:14px;height:14px}
tfoot td{border-bottom:none;font-family:var(--mono);font-size:11px;color:var(--muted);height:30px}
tfoot .namecol{font-family:var(--sans);font-size:12px;left:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.part{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.dot.full{background:var(--accent)}
.edit{display:flex;flex-direction:column;gap:4px;padding-block:4px}
.namecol{font-weight:400}
.edit input{width:100%;font-size:13px;padding:4px 8px;font-weight:400}
.edit .row{display:flex;gap:4px}
.edit .row .btn{padding:2px 8px;font-size:12px}
.edit .row .del{color:var(--danger);margin-left:auto}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.holname{font-size:12px;color:var(--muted)}
@media (max-width:760px){
  header.top{grid-template-columns:1fr;justify-items:center}
}
@media (max-width:600px){
  .monthnav h1{font-size:20px;min-width:7.5em}
  :root{--catw:78px}
  .namecol{min-width:120px;max-width:140px}
  .stat{min-width:52px;padding:0 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (hover:none){.insb{opacity:.8;transform:none;pointer-events:auto}}
.cathead{display:flex;align-items:center;gap:6px;min-width:0}
.cathead .cn{font-size:12px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
.cathead .cn.none{color:var(--muted);font-weight:500}
.cdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--hue)}
.grip{flex:none;display:inline-grid;place-items:center;width:18px;height:24px;margin-left:-4px;border-radius:4px;color:var(--muted);cursor:grab;touch-action:none;opacity:.35;transition:opacity .12s,background .12s}
.grip svg{width:10px;height:14px}
tr:hover .grip,.catcol:hover .grip{opacity:1}
.grip:hover{background:var(--off)}
tr.gend>*{border-bottom:1.5px solid var(--line2)}
tbody tr:last-child>*{border-bottom:none}
tr.emptyrow .namecol{color:var(--muted);font-size:12px}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
tr.dragsrc>*:not(.catcol){opacity:.35}
.catcol.dropin{box-shadow:inset 0 0 0 2px var(--today)}
#dropline{position:fixed;height:3px;border-radius:2px;background:var(--today);pointer-events:none;z-index:50}
#ghost{position:fixed;z-index:51;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);transform:translate(12px,-50%);white-space:nowrap}
.catedit{display:flex;flex-direction:column;gap:4px}
.catedit input{width:100%;font-size:12px;padding:3px 6px}
.catedit .row{display:flex;gap:4px;flex-wrap:wrap}
.catedit .btn{padding:1px 6px;font-size:11px}
.catedit .del{color:var(--danger)}
#newCat{flex:0 1 150px}
form.catform{display:flex;gap:8px;align-items:center}
form.catform input{width:180px}
.hright{justify-self:end}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.mini{padding:2px 10px;font-size:12px;border-radius:6px}
.ib{flex:none;width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:6px;color:var(--muted);padding:0}
.ib svg{width:14px;height:14px}
.ib:hover{background:var(--off);color:var(--ink)}
.ib[data-act="add"]{color:var(--accent)}
.ib[data-act="add"]:hover{background:var(--accent-soft)}
.ib.del:hover{color:var(--danger)}
.ib.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.erow{display:flex;align-items:center;gap:4px}
.erow input{flex:1 1 auto}
.erow.hint{gap:6px;flex-wrap:wrap}
.erow.hint span{font-size:11px;color:var(--muted)}
.edit input[type=url]{font-size:12px;padding:3px 8px;color:var(--muted)}
.cin{flex:1 1 auto;width:100%;min-width:0;font-size:12px!important;font-weight:700!important;padding:3px 6px!important}
.cact{display:flex;gap:2px;margin-left:auto}
table.editing .cathead{flex-wrap:wrap;row-gap:2px}
table.editing{--catw:170px}
table.editing .namecol{width:360px;min-width:320px;max-width:380px}
table.editing .cathead .cin{flex:1 1 0;width:auto}
table.editing .cact{width:100%;justify-content:flex-end}
.addlink{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line2);background:transparent;border-radius:8px;padding:5px 12px;font-size:12px;color:var(--accent);font-weight:700}
.addlink svg{width:13px;height:13px}
.addlink:hover{background:var(--accent-soft);border-color:var(--accent)}
tr.draft>.namecol,tr.draft>.catcol{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
tr.draft input{border-color:var(--accent)}
.addcell{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:10px 8px!important;display:table-cell}
.addcell .addlink+.addlink{margin-left:8px}
tr.addrow>*{border-bottom:none}
.empty .addlink{margin-left:8px}
@media (max-width:760px){.hright{justify-self:center}}
.tablewrap{position:relative}
#ins{position:absolute;inset:0;pointer-events:none;z-index:6}
.insb{position:absolute;width:20px;height:20px;border-radius:50%;padding:0;display:grid;place-items:center;pointer-events:none;
  background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s,background .12s}
.insb.on,.insb:focus-visible{opacity:1;transform:scale(1);pointer-events:auto}
.insb svg{width:11px;height:11px}
.insb.on:hover,.insb:focus-visible{background:var(--accent);color:#fff;transform:scale(1.15)}
.insb.cat{color:var(--today);border-color:var(--today)}
.insb.cat.on:hover,.insb.cat:focus-visible{background:var(--today);color:#fff}
body.dragging #ins{display:none}
tr.draft.err input.dname{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 25%,transparent)}
.errmsg{color:var(--danger);font-weight:700}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
tr.shake .dname{animation:shake .25s}
@media (prefers-reduced-motion:reduce){tr.shake .dname{animation:none}}
/* セール期間 */
:root{--ev-ss:#C8323A;--ev-marathon:#D9831F;--ev-other:#6B6FD6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ev-ss:#E0565D;--ev-marathon:#E9A04A;--ev-other:#8E92EC}}
:root[data-theme="dark"]{--ev-ss:#E0565D;--ev-marathon:#E9A04A;--ev-other:#8E92EC}
thead tr.evrow th{position:static;background:var(--surface);border-bottom:none;padding:5px 1px 3px;height:30px}
thead tr.evrow th.catcol,thead tr.evrow th.namecol{position:sticky;left:0;z-index:4}
thead tr.evrow th.namecol{left:var(--catw);font-size:11px;color:var(--muted);font-weight:500;vertical-align:middle}
thead tr.evrow th.evoff{background:color-mix(in srgb,var(--off) 55%,var(--surface))}
.evbar{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:22px;border-radius:5px;border:none;padding:0 6px;
  background:var(--evc);color:#fff;font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;cursor:default}
.evbar small{font-weight:500;font-size:10px;opacity:.85;letter-spacing:0;font-family:var(--mono)}
table.editing .evbar{cursor:pointer}
table.editing .evbar:hover{filter:brightness(1.08);box-shadow:0 0 0 2px color-mix(in srgb,var(--evc) 35%,transparent)}
.evadd{font-size:11px;padding:3px 8px}
.evback{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:60}
.evpanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;width:min(360px,calc(100vw - 32px));background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:18px;display:flex;flex-direction:column;gap:12px}
.evpanel h3{margin:0;font-size:15px}
.evtypes{display:flex;gap:6px}
.evtypes label{flex:1}
.evtypes input{position:absolute;opacity:0;pointer-events:none}
.evtypes span{display:block;text-align:center;padding:7px 0;border-radius:8px;border:1.5px solid var(--line);font-weight:700;font-size:13px;cursor:pointer}
.evtypes input:checked+span{color:#fff;border-color:transparent}
.evtypes input:checked+.t-ss{background:var(--ev-ss)}
.evtypes input:checked+.t-marathon{background:var(--ev-marathon)}
.evtypes input:checked+.t-other{background:var(--ev-other)}
.evtypes input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.evdt{display:grid;grid-template-columns:3em 1fr;align-items:center;gap:8px}
.evdt label{font-size:12px;color:var(--muted)}
.evdt input,#evLabel{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.everr{margin:0;font-size:12px;color:var(--danger);font-weight:700}
.evbtns{display:flex;gap:8px;align-items:center}
.evbtns span{flex:1}
.evbtns .del{color:var(--danger)}
/* 見やすさ：日付の縦線・行ハイライト */
:root{--grid:color-mix(in srgb,var(--line) 75%,var(--surface));--hl:color-mix(in srgb,var(--today) 8%,transparent)}
td.cell,th.dayh,tfoot td:not(.namecol):not(.stat),thead tr.evrow th:not(.catcol):not(.namecol):not(.stat){border-right:1px solid var(--grid)}
th.dayh.w-mon,td.cell.w-mon,tfoot td.w-mon{border-left:1px solid var(--line2)}
tbody tr[data-item]:hover>td.cell,tbody tr[data-item]:hover>.namecol,tbody tr[data-item]:hover>.stat{background-image:linear-gradient(var(--hl),var(--hl))}
tbody tr[data-item]:hover>.namecol .nm{color:var(--today)}
td.cell.today{background-image:linear-gradient(color-mix(in srgb,var(--today) 6%,transparent),color-mix(in srgb,var(--today) 6%,transparent))}
/* セール段は帯だけ */
thead tr.evrow th{border:none!important;background:var(--surface)!important;box-shadow:none!important}
thead tr.evrow th.namecol{padding:3px 12px}
/* 実施タイミング */
.cell.rest .chk{opacity:0;border-style:dashed}
.cell.rest:hover .chk,.cell.rest .chk:focus-visible{opacity:.6}
.cell.rest .chk[aria-pressed="true"]{opacity:1;border-style:solid}
.cell.miss .chk{border-color:color-mix(in srgb,var(--danger) 55%,var(--line));background:color-mix(in srgb,var(--danger) 6%,transparent)}
.rchip{flex:none;margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--off);border-radius:4px;padding:1px 6px;white-space:nowrap}
.rulebtn{flex:none;display:inline-flex;align-items:center;gap:4px;max-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;color:var(--ink)}
.rulebtn svg{width:13px;height:13px;flex:none;color:var(--accent)}
.rulebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rulebtn:hover{border-color:var(--accent)}
.rpanel{width:min(440px,calc(100vw - 32px))}
.rtypes,.tgs{display:flex;flex-wrap:wrap;gap:6px}
.rtypes .tg{flex:1}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg span{display:block;min-width:36px;text-align:center;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.tg input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.tg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.tgs.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tgs.dates .tg span{min-width:0;padding:5px 0;font-size:12px;font-family:var(--mono)}
.tgs.dates .tg:last-child{grid-column:span 2}
.tgs.dates .tg:last-child span{font-family:var(--sans)}
.rsec{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.rrow label{font-size:12px;color:var(--muted)}
.rrow small{font-size:11px;color:var(--muted)}
.rrow input[type=date],.rrow select,#rN{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#rN{width:64px}
.chkline{display:flex;align-items:center;gap:8px;font-size:13px}
.rprev{margin:0;padding:8px 10px;border-radius:8px;background:var(--off);font-size:12px;line-height:1.6;color:var(--ink)}
#rSave:disabled{opacity:.4;cursor:not-allowed}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h2 class="brand" style="margin:0"><img class="lt" src="assets/logo.png" alt="RoutineCheck" width="204" height="34"><img class="dk" src="assets/logo-dark.png" alt="RoutineCheck" width="204" height="34"></h2>
    <div class="monthnav">
      <button class="btn icon" id="prev" aria-label="前の月">‹</button>
      <h1 id="title"></h1>
      <button class="btn icon" id="next" aria-label="次の月">›</button>
      <button class="btn" id="todayBtn">今月</button>
    </div>

<script>
(function(){
/* ---------- 日本の祝日 ---------- */
function nthMonday(y,m,n){const d=new Date(y,m-1,1);const first=(8-d.getDay())%7+1;return first+(n-1)*7;}
function holidaysOf(y){
  const h=new Map(), put=(m,d,name)=>h.set(m+'-'+d,name);
  put(1,1,'元日');put(1,nthMonday(y,1,2),'成人の日');
  put(2,11,'建国記念の日');if(y>=2020)put(2,23,'天皇誕生日');
  const b=y-1980, leap=Math.floor(b/4);
  put(3,Math.floor(20.8431+0.242194*b-leap),'春分の日');
  put(4,29,'昭和の日');put(5,3,'憲法記念日');put(5,4,'みどりの日');put(5,5,'こどもの日');
  put(7,nthMonday(y,7,3),'海の日');put(8,11,'山の日');
  put(9,nthMonday(y,9,3),'敬老の日');
  put(9,Math.floor(23.2488+0.242194*b-leap),'秋分の日');
  put(10,nthMonday(y,10,2),'スポーツの日');
  put(11,3,'文化の日');put(11,23,'勤労感謝の日');
  // 国民の休日（祝日に挟まれた平日）
  for(let t=new Date(y,0,2);t.getFullYear()===y;t.setDate(t.getDate()+1)){
    const k=(t.getMonth()+1)+'-'+t.getDate();
    if(h.has(k)||t.getDay()===0)continue;
    const p=new Date(t);p.setDate(p.getDate()-1);const n=new Date(t);n.setDate(n.getDate()+1);
    if(h.has((p.getMonth()+1)+'-'+p.getDate())&&h.has((n.getMonth()+1)+'-'+n.getDate())&&n.getFullYear()===y)h.set(k,'国民の休日');
  }
  // 振替休日
  const base=[...h.keys()];
  for(const k of base){
    const [m,d]=k.split('-').map(Number);const t=new Date(y,m-1,d);
    if(t.getDay()!==0)continue;
    do{t.setDate(t.getDate()+1);}while(h.has((t.getMonth()+1)+'-'+t.getDate()));
    if(t.getFullYear()===y)h.set((t.getMonth()+1)+'-'+t.getDate(),'振替休日');
  }
  return h;
}
const holCache={};
function holiday(y,m,d){return (holCache[y]||(holCache[y]=holidaysOf(y))).get(m+'-'+d)||null;}

/* ---------- 状態 ---------- */
const WD='日月火水木金土';
const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()+1};
let items=[];            // [{id,name,url,cat,order}]
let events=[];           // セール期間 [{id,type:'ss'|'marathon'|'other',label,start:'YYYY-MM-DDTHH:MM',end}]
let cats=[];             // [{id,name,order}]
let checks={};           // {itemId:{"1":true}}
let editing=false;
let db=null, unsubMonth=null, local=false;
let drag=null, renderPending=false, drafts=[], focusId=null;
function syncDrafts(){for(const d of drafts){const n=$('dn-'+d.k),u=$('du-'+d.k),c=$('dc-'+d.k);if(n)d.name=n.value;if(u)d.url=u.value;if(c)d.name=c.value;}}
function addDraft(o){syncDrafts();const d={k:newId('d'),name:'',url:'',err:false,...o};drafts.push(d);focusId=(d.type==='cat'?'dc-':'dn-')+d.k;render();}
const NONE='_none';
const HUES=['#4A90E2','#2A9C78','#E0A33A','#C0463E','#8A63D2','#3AA7B8','#D46A9C','#7A8B3A'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const monthKey=()=>view.y+'-'+pad(view.m);
const status=t=>{$('status').textContent=t;};
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function hueOf(c){if(Number.isInteger(c.hue))return HUES[c.hue%HUES.length];let h=0;for(const ch of String(c.id))h=(h*31+ch.charCodeAt(0))>>>0;return HUES[h%HUES.length];}
function nextHue(){const used=cats.map(c=>c.hue);for(let i=0;i<HUES.length;i++)if(!used.includes(i))return i;return cats.length%HUES.length;}

/* ---------- 保存層（db / 端末内フォールバック） ---------- */
const LS='routinecheck-v1';
function lsRead(){try{const s=JSON.parse(localStorage.getItem(LS))||{};return {items:s.items||[],cats:s.cats||[],events:s.events||[],months:s.months||{}};}catch(e){return {items:[],cats:[],events:[],months:{}};}}
function lsWrite(s){try{localStorage.setItem(LS,JSON.stringify(s));}catch(e){}}

let writing=false, dirty=false;
async function saveMonth(){
  if(local){const s=lsRead();s.months[monthKey()]=checks;lsWrite(s);return;}
  if(writing){dirty=true;return;}
  writing=true;const key=monthKey(), body={checks:JSON.parse(JSON.stringify(checks))};
  try{await db.doc('months/'+key).set(body);status('保存しました');}
  catch(e){status(e.code==='invalid_argument'?'このページは閲覧のみです':'保存できませんでした。もう一度お試しください');}
  writing=false;if(dirty){dirty=false;saveMonth();}
}
function bodyOf(coll,o){if(coll==='events')return {type:o.type,label:o.label||'',start:o.start,end:o.end};return coll==='items'?{name:o.name,url:o.url||'',cat:o.cat||'',order:o.order,rule:o.rule||null,created:o.created||''}:{name:o.name,order:o.order,hue:Number.isInteger(o.hue)?o.hue:null};}
async function saveDoc(coll,o){
  if(local){const s=lsRead();const a=s[coll];const i=a.findIndex(x=>x.id===o.id);const v={id:o.id,...bodyOf(coll,o)};if(i>=0)a[i]=v;else a.push(v);lsWrite(s);return;}
  try{await db.doc(coll+'/'+o.id).set(bodyOf(coll,o));status('保存しました');}
  catch(e){status('保存できませんでした');}
}
async function removeDoc(coll,id){
  if(local){const s=lsRead();s[coll]=s[coll].filter(x=>x.id!==id);lsWrite(s);return;}
  try{await db.doc(coll+'/'+id).delete();status('削除しました');}catch(e){status('削除できませんでした');}
}

function loadMonth(){
  if(unsubMonth){unsubMonth();unsubMonth=null;}
  checks={};
  if(local){checks=lsRead().months[monthKey()]||{};render();return;}
  const key=monthKey();
  unsubMonth=db.doc('months/'+key).onSnapshot(s=>{
    if(key!==monthKey())return;
    if(writing||dirty)return;
    const d=s.exists?s.data():null;
    checks=d&&d.checks?JSON.parse(JSON.stringify(d.checks)):{};
    safeRender();
  },e=>status('同期が止まりました。再読み込みしてください'));
  render();
}

/* ---------- 分類 ---------- */
const sortedCats=()=>[...cats].sort((a,b)=>a.order-b.order);
function catOf(it){return it.cat&&cats.some(c=>c.id===it.cat)?it.cat:NONE;}
function itemsIn(cid){return items.filter(it=>catOf(it)===cid).sort((a,b)=>a.order-b.order);}
function groups(){
  const gs=sortedCats().map(c=>({id:c.id,cat:c,items:itemsIn(c.id)}));
  const none=itemsIn(NONE);
  if(none.length)gs.push({id:NONE,cat:null,items:none});
  return gs;
}
function resolveCat(name){
  name=(name||'').trim();if(!name)return '';
  const hit=cats.find(c=>c.name===name);if(hit)return hit.id;
  const c={id:newId('c'),name,hue:nextHue(),order:cats.reduce((m,x)=>Math.max(m,x.order),0)+1};
  cats.push(c);saveDoc('cats',c);return c.id;
}

/* ---------- 描画 ---------- */
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:#fff"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const LINK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3L7.5 8.5M11 9.5V13H3V5h3.5"/></svg>';
const GRIP='<svg viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.3"/><circle cx="7.5" cy="2.5" r="1.3"/><circle cx="2.5" cy="7" r="1.3"/><circle cx="7.5" cy="7" r="1.3"/><circle cx="2.5" cy="11.5" r="1.3"/><circle cx="7.5" cy="11.5" r="1.3"/></svg>';
const PLUS='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';
const TRASH='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}}
function safeRender(){if(drag){renderPending=true;return;}const a=document.activeElement;if(editing&&a&&a.tagName==='INPUT'&&a.closest('#box')){renderPending=true;return;}render();}
const gripHtml=(type,id,title)=>'<span class="grip" data-drag="'+type+'" data-id="'+id+'" title="'+title+'">'+GRIP+'</span>';
const iconBtn=(act,id,label,svg,cls,attrs)=>'<button class="ib'+(cls?' '+cls:'')+'" data-act="'+act+'" data-id="'+id+'"'+(attrs||'')+' title="'+label+'" aria-label="'+label+'">'+svg+'</button>';

function catCell(g,rows){
  const hue=g.cat?hueOf(g.cat):'var(--muted)';
  let h='<td class="catcol" rowspan="'+rows+'" data-catcell="'+g.id+'" style="--hue:'+hue+'"><div class="cathead">';
  if(!g.cat){
    h+='<span class="cn none">未分類</span>';
  }else if(editing){
    h+=gripHtml('cat',g.id,'ドラッグで分類を並べ替え')+'<span class="cdot"></span><input type="text" class="cin" id="cn-'+g.id+'" value="'+esc(g.cat.name)+'" maxlength="20" aria-label="分類名">'+
      '<span class="cact">'+iconBtn('cdel',g.id,'分類を削除',TRASH,'del')+'</span>';
  }else{
    h+=gripHtml('cat',g.id,'ドラッグで分類を並べ替え')+'<span class="cdot"></span><span class="cn">'+esc(g.cat.name)+'</span>';
  }
  return h+'</div></td>';
}
function blankCells(info,extra){let h='';for(const c of info)h+='<td class="cell'+(c.off?' off':'')+(c.today?' today':'')+(c.w===1&&c.d>1?' w-mon':'')+'"></td>';return h+'<td class="stat">'+(extra||'')+'</td>';}
function draftRow(g,info,withCat,rows,last,d){
  let h='<tr class="draft'+(last?' gend':'')+(d.err?' err':'')+'" data-cat="'+g.id+'" data-dkey="'+d.k+'">';
  if(withCat)h+=catCell(g,rows);
  h+='<th class="namecol" scope="row"><div class="edit"><div class="erow"><input type="text" id="dn-'+d.k+'" data-key="'+d.k+'" class="din dname" value="'+esc(d.name)+'" placeholder="新しい項目名" maxlength="60" aria-label="新しい項目名"></div>'+
     '<input type="url" id="du-'+d.k+'" data-key="'+d.k+'" class="din" value="'+esc(d.url)+'" placeholder="リンク（任意）" aria-label="リンク"><div class="erow hint"><button class="btn mini primary" data-act="dsave" data-key="'+d.k+'">追加</button><button class="btn mini" data-act="dcancel" data-key="'+d.k+'">やめる</button><span>'+(d.err?'<b class="errmsg">項目名を入力してください</b>':'Enterで追加 / Escでやめる')+'</span></div></div></th>';
  return h+blankCells(info)+'</tr>';
}

function render(){
  renderPending=false;
  syncDrafts();
  const {y,m}=view, days=new Date(y,m,0).getDate();
  $('title').innerHTML='<span class="y">'+y+'</span>'+m+'月';
  const t=new Date(), isThis=t.getFullYear()===y&&t.getMonth()+1===m, today=t.getDate();
  const past=(y*12+m)<(t.getFullYear()*12+t.getMonth()+1);
  const elapsed=isThis?today:(past?days:0);
  const info=[];const hols=[];
  for(let d=1;d<=days;d++){
    const w=new Date(y,m-1,d).getDay(), h=holiday(y,m,d);
    if(h)hols.push(m+'/'+d+' '+h);
    info.push({d,w,h,off:w===0||w===6||!!h,today:isThis&&d===today,future:(isThis&&d>today)||(!past&&!isThis)});
  }
  $('holList').textContent=hols.length?'今月の祝日: '+hols.join('　'):'';
  const gs=groups();
  if(editing&&drafts.some(d=>d.type==='item'&&d.cat===NONE)&&!gs.some(g=>g.id===NONE))gs.push({id:NONE,cat:null,items:[]});
  let html='<table'+(editing?' class="editing"':'')+'><thead>'+eventRows(y,m,days,info)+'<tr><th class="catcol">分類</th><th class="namecol">項目</th>';
  for(const c of info){
    const cls=['dayh',c.off?'off':'',c.w===6?'sat':'',c.w===0?'sun':'',c.h?'hol':'',c.today?'today':'',c.w===1&&c.d>1?'w-mon':''].join(' ');
    html+='<th class="'+cls+'"'+(c.h?' title="'+esc(c.h)+'"':'')+'><span class="n">'+c.d+'</span><span class="w">'+(c.h?'祝':WD[c.w])+'</span></th>';
  }
  html+='<th class="stat">達成</th></tr></thead><tbody>';
  const catIds=new Set(cats.map(c=>c.id));
  const cds=editing?drafts.filter(d=>d.type==='cat'):[];
  const catDraft=cds.length>0;
  const cAnchor=d=>d.before&&catIds.has(d.before)?d.before:null;
  const catDraftHtml=d=>'<tr class="draft catdraft gend'+(d.err?' err':'')+'" data-cat="_new" data-dkey="'+d.k+'"><td class="catcol" style="--hue:'+HUES[nextHue()]+'"><div class="cathead"><span class="cdot"></span><input type="text" id="dc-'+d.k+'" data-key="'+d.k+'" class="din dname cin" value="'+esc(d.name)+'" placeholder="新しい分類名" maxlength="20" aria-label="新しい分類名"></div></td>'+
    '<th class="namecol" scope="row"><div class="erow hint"><button class="btn mini primary" data-act="dsave" data-key="'+d.k+'">分類を作る</button><button class="btn mini" data-act="dcancel" data-key="'+d.k+'">やめる</button><span>'+(d.err?'<b class="errmsg">'+esc(d.errMsg||'分類名を入力してください')+'</b>':'Enterで作成 / Escでやめる')+'</span></div></th>'+blankCells(info)+'</tr>';
  let endCatDone=false;
  for(const g of gs){
    if(g.cat)cds.filter(d=>cAnchor(d)===g.id).forEach(d=>{html+=catDraftHtml(d);});
    if(g.id===NONE&&!endCatDone){cds.filter(d=>cAnchor(d)===null).forEach(d=>{html+=catDraftHtml(d);});endCatDone=true;}
    const ids=new Set(g.items.map(x=>x.id));
    const ds=editing?drafts.filter(d=>d.type==='item'&&d.cat===g.id):[];
    const anchorOf=d=>d.after==='_top'||ids.has(d.after)?d.after:null;
    const rows=g.items.length+ds.length;
    if(!rows){
      html+='<tr class="emptyrow gend" data-cat="'+g.id+'">'+catCell(g,1)+'<th class="namecol" scope="row">'+(editing?'<button class="addlink" data-act="add" data-id="'+g.id+'">'+PLUS+'項目を追加</button>':'ここへ項目をドラッグ')+'</th>'+blankCells(info)+'</tr>';
      continue;
    }
    let first=true, n=0;
    const emitDrafts=a=>ds.filter(d=>anchorOf(d)===a).forEach(d=>{n++;html+=draftRow(g,info,first,rows,n===rows,d);first=false;});
    emitDrafts('_top');
    g.items.forEach(it=>{
      n++;
      const ck=checks[it.id]||{};let cnt=0;
      html+='<tr data-item="'+it.id+'" data-cat="'+g.id+'"'+(n===rows?' class="gend"':'')+'>';
      if(first){html+=catCell(g,rows);first=false;}
      html+='<th class="namecol" scope="row">';
      if(editing){
        html+='<div class="edit"><div class="erow">'+gripHtml('item',it.id,'ドラッグで並べ替え')+'<input type="text" id="en-'+it.id+'" value="'+esc(it.name)+'" maxlength="60" aria-label="項目名">'+
          '<button class="rulebtn" data-act="rule" data-id="'+it.id+'" title="実施するタイミングを設定">'+CAL+'<span>'+esc(ruleLabel(it.rule)||'毎日')+'</span></button>'+
          iconBtn('del',it.id,'項目を削除',TRASH,'del')+'</div>'+
          '<input type="url" id="eu-'+it.id+'" value="'+esc(it.url||'')+'" placeholder="リンク（任意）" aria-label="リンク"></div>';
      }else{
        const u=safeUrl(it.url||'');
        html+='<div class="iname">'+gripHtml('item',it.id,'ドラッグで並べ替え')+'<span class="nm" title="'+esc(it.name)+'">'+esc(it.name)+'</span>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" aria-label="'+esc(it.name)+'のリンクを開く">'+LINK+'</a>':'')+(ruleLabel(it.rule)?'<span class="rchip" title="'+esc(ruleLong(it.rule))+'">'+esc(ruleLabel(it.rule))+'</span>':'')+'</div>';
      }
      html+='</th>';
      const pl=planView(it,y,m,info,ck);
      for(const c of info){
        const on=!!ck[c.d], st=pl.state[c.d];
        html+='<td class="cell'+(c.off?' off':'')+(c.today?' today':'')+(c.w===1&&c.d>1?' w-mon':'')+(st?' '+st:'')+'"><button class="chk'+(c.future?' future':'')+'" data-item="'+it.id+'" data-day="'+c.d+'" aria-pressed="'+on+'" aria-label="'+esc(it.name)+' '+m+'月'+c.d+'日'+(st==='rest'?'（予定なし）':'')+'">'+CHECK+'</button></td>';
      }
      html+='<td class="stat" title="'+esc(pl.statTip)+'"><b>'+pl.done+'</b>/'+pl.target+'</td></tr>';
      emitDrafts(it.id);
    });
    emitDrafts(null);
  }
  if(!endCatDone)cds.filter(d=>cAnchor(d)===null).forEach(d=>{html+=catDraftHtml(d);});
  if(editing&&!catDraft&&(!cats.length||!gs.some(g=>g.id===NONE))){
    {
      html+='<tr class="addrow"><td class="addcell" colspan="2">'+(cats.length?'':'<button class="addlink" data-act="newcat">'+PLUS+'分類を追加</button>')+
        (gs.some(g=>g.id===NONE)?'':'<button class="addlink" data-act="add" data-id="'+NONE+'">'+PLUS+'未分類で項目を追加</button>')+'</td><td colspan="'+(info.length+1)+'"></td></tr>';
    }
  }
  html+='</tbody>';
  if(items.length){
    html+='<tfoot><tr><td class="namecol" colspan="2">その日の達成</td>';
    for(const c of info){
      let k=0,den=0;
      for(const it of items){const on=!!(checks[it.id]||{})[c.d];const pv=planCache[it.id];const sch=pv?pv.sched[c.d]:true;if(sch||on)den++;if(on)k++;}
      const cls=k===0?'':(k>=den?'full':'part');
      html+='<td class="'+(c.off?'off':'')+(c.w===1&&c.d>1?' w-mon':'')+'" title="'+k+'/'+den+'"><span class="dot '+cls+'"></span></td>';
    }
    html+='<td class="stat"></td></tr></tfoot>';
  }
  html+='</table>';
  if(!gs.length&&!editing)html+='<div class="empty">まだ項目がありません。<button class="addlink" data-act="startedit">'+PLUS+'項目を追加する</button></div>';
  const box=$('box'), sl=box.scrollLeft;
  const ae=document.activeElement, prevFocus=ae&&ae.id&&box.contains(ae)?ae.id:null;
  const selPos=prevFocus&&typeof ae.selectionStart==='number'?ae.selectionStart:null;
  box.innerHTML=html;
  box.scrollLeft=sl;
  placeInserts();
  const f=(focusId&&$(focusId))||(prevFocus&&$(prevFocus));focusId=null;
  if(f){f.focus({preventScroll:false});if(selPos!==null&&f.id===prevFocus)try{f.setSelectionRange(selPos,selPos);}catch(e){}}
}

/* 行・分類の境目に出す「＋」（マウスを乗せた行の上下に表示） */
let hover={r:null,g:null};
function placeInserts(){
  const layer=$('ins');
  if(!editing){layer.innerHTML='';return;}
  const box=$('box'), head=box.querySelector('thead .catcol');if(!head){layer.innerHTML='';return;}
  const catW=head.offsetWidth, bt=box.offsetTop, bl=box.offsetLeft+1;
  const rows=[...box.querySelectorAll('tbody tr')];
  const out=[];
  const btn=(x,y,k,attrs,label,cls)=>out.push('<button class="insb'+(cls?' '+cls:'')+'" data-k="'+k+'" style="left:'+(bl+x-10)+'px;top:'+(bt+y-10)+'px"'+attrs+' title="'+label+'" aria-label="'+label+'">'+PLUS+'</button>');
  // 項目：各行の上と下
  let prev=null;
  rows.forEach(tr=>{
    const cid=tr.dataset.cat, id=tr.dataset.item;
    if(!cid||cid==='_new'||!id){if(!tr.classList.contains('draft'))prev=null;return;}
    const top=tr.offsetTop, bottom=top+tr.offsetHeight;
    const above=prev&&prev.cat===cid?prev.id:'_top';
    btn(catW+22,top,'r:'+id,' data-ins="item" data-cat="'+cid+'" data-after="'+above+'"','上に項目を追加');
    btn(catW+22,bottom,'r:'+id,' data-ins="item" data-cat="'+cid+'" data-after="'+id+'"','下に項目を追加');
    prev={cat:cid,id};
  });
  // 分類：各分類の上と下
  const span={};
  rows.forEach(tr=>{const cid=tr.dataset.cat;if(!cid||cid===NONE||cid==='_new')return;
    const t=tr.offsetTop,b=t+tr.offsetHeight;if(!span[cid])span[cid]={t,b};else span[cid].b=b;});
  const ids=Object.keys(span);
  ids.forEach((cid,i)=>{
    btn(catW/2,span[cid].t,'g:'+cid,' data-ins="cat" data-before="'+cid+'"','上に分類を追加','cat');
    btn(catW/2,span[cid].b,'g:'+cid,' data-ins="cat" data-before="'+(ids[i+1]||'')+'"','下に分類を追加','cat');
  });
  layer.innerHTML=out.join('');
  showHover();
}
function showHover(){
  $('ins').querySelectorAll('.insb').forEach(b=>b.classList.toggle('on',b.dataset.k===hover.r||b.dataset.k===hover.g));
}
$('box').addEventListener('mouseover',e=>{
  if(!editing||drag)return;
  const tr=e.target.closest('tbody tr');
  const r=tr&&tr.dataset.item?'r:'+tr.dataset.item:null;
  const g=tr&&tr.dataset.cat&&tr.dataset.cat!==NONE?'g:'+tr.dataset.cat:null;
  if(r!==hover.r||g!==hover.g){hover={r,g};showHover();}
});
$('box').addEventListener('focusin',e=>{
  const tr=e.target.closest('tbody tr');if(!tr||!editing)return;
  hover={r:tr.dataset.item?'r:'+tr.dataset.item:null,g:tr.dataset.cat&&tr.dataset.cat!==NONE?'g:'+tr.dataset.cat:null};showHover();
});
window.addEventListener('resize',()=>{if(editing)placeInserts();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(editing)placeInserts();});

function scrollToToday(){
  const box=$('box'), th=box.querySelector('.dayh.today');
  if(th){box.scrollLeft=Math.max(0,th.offsetLeft-box.clientWidth/2);}else box.scrollLeft=0;

/* ---------- ドラッグで並べ替え ---------- */
const line=$('dropline'), ghost=$('ghost');
function clearMarks(){line.hidden=true;document.querySelectorAll('.dropin').forEach(e=>e.classList.remove('dropin'));}
function showLine(yPos){const r=$('box').getBoundingClientRect();line.style.left=r.left+'px';line.style.width=r.width+'px';line.style.top=(yPos-1.5)+'px';line.hidden=false;}
function groupRect(cid){
  const rows=[...$('box').querySelectorAll('tbody tr[data-cat="'+cid+'"]')];
  if(!rows.length)return null;
  return {top:rows[0].getBoundingClientRect().top,bottom:rows[rows.length-1].getBoundingClientRect().bottom};
}
function findTarget(x,y){
  const el=document.elementFromPoint(x,y);const tr=el&&el.closest('#box tbody tr');
  clearMarks();
  if(!tr)return null;
  const cid=tr.dataset.cat;
  if(!cid||cid==='_new')return null;
  if(drag.type==='item'){
    const cell=el.closest('.catcol');
    if(cell||!tr.dataset.item){
      const cc=$('box').querySelector('[data-catcell="'+cid+'"]');if(cc)cc.classList.add('dropin');
      const gr=groupRect(cid);if(gr)showLine(gr.bottom);
      return {cat:cid,ref:null};
    }
    const r=tr.getBoundingClientRect(), before=y<r.top+r.height/2;
    showLine(before?r.top:r.bottom);
    return {cat:cid,ref:tr.dataset.item,before};
  }
  const gr=groupRect(cid);if(!gr)return null;
  const before=cid===NONE?true:y<(gr.top+gr.bottom)/2;
  showLine(before?gr.top:gr.bottom);
  return {ref:cid,before};
}
function applyItemDrop(t){
  const it=items.find(x=>x.id===drag.id);if(!it)return;
  const list=itemsIn(t.cat).filter(x=>x!==it);
  let idx=list.length;
  if(t.ref){const i=list.findIndex(x=>x.id===t.ref);if(i>=0)idx=i+(t.before?0:1);}
  list.splice(idx,0,it);
  const newCat=t.cat===NONE?'':t.cat;
  const moved=catOf(it)!==t.cat;
  it.cat=newCat;
  list.forEach((x,i)=>{const o=i+1;if(x.order!==o||(x===it&&moved)){x.order=o;saveDoc('items',x);}});
}
function applyCatDrop(t){
  const c=cats.find(x=>x.id===drag.id);if(!c||t.ref===c.id)return;
  const list=sortedCats().filter(x=>x!==c);
  let idx=list.length;
  if(t.ref!==NONE){const i=list.findIndex(x=>x.id===t.ref);if(i>=0)idx=i+(t.before?0:1);}
  list.splice(idx,0,c);
  list.forEach((x,i)=>{const o=i+1;if(x.order!==o){x.order=o;saveDoc('cats',x);}});
}
let scrollTimer=null;
function autoScroll(y){
  clearInterval(scrollTimer);
  const edge=60,h=window.innerHeight;let dy=0;
  if(y<edge)dy=-12;else if(y>h-edge)dy=12;
  if(dy)scrollTimer=setInterval(()=>{window.scrollBy(0,dy);if(drag&&drag.last)drag.target=findTarget(drag.last.x,drag.last.y);},16);
}
$('box').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g||e.button>0)return;
  e.preventDefault();
  const type=g.dataset.drag,id=g.dataset.id;
  const label=type==='item'?(items.find(x=>x.id===id)||{}).name:(cats.find(x=>x.id===id)||{}).name;
  drag={type,id,target:null,last:{x:e.clientX,y:e.clientY}};
  ghost.textContent=(type==='cat'?'分類: ':'')+(label||'');ghost.hidden=false;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  document.body.classList.add('dragging');
  const sel=type==='item'?'tbody tr[data-item="'+id+'"]':'tbody tr[data-cat="'+id+'"]';
  $('box').querySelectorAll(sel).forEach(r=>r.classList.add('dragsrc'));
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.last={x:e.clientX,y:e.clientY};
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  drag.target=findTarget(e.clientX,e.clientY);
  autoScroll(e.clientY);
});
function endDrag(apply){
  if(!drag)return;
  clearInterval(scrollTimer);clearMarks();ghost.hidden=true;document.body.classList.remove('dragging');
  if(apply&&drag.target){if(drag.type==='item')applyItemDrop(drag.target);else applyCatDrop(drag.target);}
  drag=null;render();
}
window.addEventListener('pointerup',()=>endDrag(true));
window.addEventListener('pointercancel',()=>endDrag(false));
window.addEventListener('keydown',e=>{if(e.key==='Escape')endDrag(false);});

/* ---------- 操作 ---------- */
function commitDraft(k){
  syncDrafts();
  const di=drafts.findIndex(x=>x.k===k);if(di<0)return;
  const d=drafts[di], name=(d.name||'').trim();
  const fail=msg=>{d.err=true;d.errMsg=msg;focusId=(d.type==='cat'?'dc-':'dn-')+d.k;render();
    const el=$(focusId);if(el){const tr=el.closest('tr');tr.classList.remove('shake');void tr.offsetWidth;tr.classList.add('shake');}};
  if(d.type==='cat'){
    if(!name)return fail('分類名を入力してください');
    if(cats.some(c=>c.name===name))return fail('同じ名前の分類がすでにあります');
    const id=resolveCat(name);
    const c=cats.find(x=>x.id===id), list=sortedCats().filter(x=>x!==c);
    let idx=list.length;if(d.before){const i=list.findIndex(x=>x.id===d.before);if(i>=0)idx=i;}
    list.splice(idx,0,c);list.forEach((x,i)=>{const o=i+1;if(x.order!==o){x.order=o;saveDoc('cats',x);}});
    const nd={k:newId('d'),type:'item',cat:id,after:null,name:'',url:'',err:false};   // 続けて中の項目を入力
    drafts.splice(di,1,nd);focusId='dn-'+nd.k;
    status('分類「'+name+'」を作りました');render();return;
  }
  if(!name)return fail('項目名を入力してください');
  const url=(d.url||'').trim();
  const cat=d.cat===NONE?'':d.cat;
  const it={id:newId('i'),name,url,cat,order:0,created:ymd(new Date())};
  const list=itemsIn(d.cat);
  let idx=list.length;
  if(d.after==='_top')idx=0;
  else if(d.after){const i=list.findIndex(x=>x.id===d.after);if(i>=0)idx=i+1;}
  list.splice(idx,0,it);items.push(it);
  list.forEach((x,i)=>{const o=i+1;if(x.order!==o||x===it){x.order=o;saveDoc('items',x);}});
  // 同じ位置で後から開いた入力欄は、新しい項目の下へ
  drafts.forEach((x,i)=>{if(i>di&&x.type==='item'&&x.cat===d.cat&&x.after===d.after)x.after=it.id;});
  drafts.splice(di,1);
  render();
}
function cancelDraft(k){syncDrafts();drafts=drafts.filter(x=>x.k!==k);render();}

$('box').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('chk')){
    const id=b.dataset.item, d=b.dataset.day;
    const ck=checks[id]||(checks[id]={});
    if(ck[d])delete ck[d];else ck[d]=true;
    render();saveMonth();return;
  }
  const id=b.dataset.id, act=b.dataset.act;if(!act)return;
  if(act==='add'){addDraft({type:'item',cat:id,after:b.dataset.after||null});}
  else if(act==='newcat'){addDraft({type:'cat',before:null});}
  else if(act==='dsave'){commitDraft(b.dataset.key);}
  else if(act==='dcancel'){cancelDraft(b.dataset.key);}
  else if(act==='startedit'){setEditing(true);}
  else if(act==='rule'){const it=items.find(x=>x.id===id);if(it){syncDrafts();openRule(it);}}
  else if(act==='del'){
    if(b.dataset.confirm){items=items.filter(x=>x.id!==id);removeDoc('items',id);render();}
    else{b.dataset.confirm='1';b.classList.add('armed');b.title=b.ariaLabel='もう一度押すと削除';setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.classList.remove('armed');}},3000);}
  }else if(act==='cdel'){
    if(b.dataset.confirm){
      let o=itemsIn(NONE).reduce((mx,x)=>Math.max(mx,x.order),0);
      itemsIn(id).forEach(it=>{it.cat='';it.order=++o;saveDoc('items',it);});
      cats=cats.filter(x=>x.id!==id);removeDoc('cats',id);render();
    }else{b.dataset.confirm='1';b.classList.add('armed');b.title=b.ariaLabel='もう一度押すと削除（中の項目は未分類へ）';setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.classList.remove('armed');}},3000);}
  }
});
// 既存の項目・分類はその場で書き換え→フォーカスが外れたら保存
$('box').addEventListener('change',e=>{
  const el=e.target;if(!el.id)return;
  const [p,...rest]=el.id.split('-');const id=rest.join('-');
  if(p==='en'){const it=items.find(x=>x.id===id);const v=el.value.trim();if(!it)return;if(!v){el.value=it.name;return;}it.name=v;saveDoc('items',it);}
  else if(p==='eu'){const it=items.find(x=>x.id===id);if(!it)return;it.url=el.value.trim();saveDoc('items',it);}
  else if(p==='cn'){const c=cats.find(x=>x.id===id);const v=el.value.trim();if(!c)return;
    if(!v||cats.some(x=>x!==c&&x.name===v)){if(v)status('同じ名前の分類がすでにあります');el.value=c.name;return;}
    c.name=v;saveDoc('cats',c);}
});
$('box').addEventListener('input',e=>{

$('box').addEventListener('keydown',e=>{

$('editToggle').addEventListener('click',()=>setEditing(!editing));
$('ins').addEventListener('click',e=>{

function shift(n){view.m+=n;if(view.m<1){view.m=12;view.y--;}if(view.m>12){view.m=1;view.y++;}loadMonth();scrollToToday();}

/* ---------- 実施タイミング（ルール） ---------- */
const WDN=['日','月','火','水','木','金','土'];
const WD_ORDER=[1,2,3,4,5,6,0];
const CAL='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>';
function isBiz(dt){const w=dt.getDay();return w!==0&&w!==6&&!holiday(dt.getFullYear(),dt.getMonth()+1,dt.getDate());}
function mondayOf(dt){const x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function ymd(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function parseYmd(s){const a=String(s||'').split('-').map(Number);return a.length===3&&a[0]?new Date(a[0],a[1]-1,a[2]):null;}
const wdList=a=>WD_ORDER.filter(w=>(a||[]).includes(w)).map(w=>WDN[w]).join('・');
function ruleLabel(r){
  if(!r||r.type==='daily')return r&&r.skipOff?'平日':'';
  if(r.type==='weekly')return (r.interval===2?'隔週':'毎週')+wdList(r.wds);
  if(r.type==='nth')return (r.nths||[]).map(n=>n==='L'?'最終':'第'+n).join('・')+wdList(r.wds);
  if(r.type==='date')return '毎月'+(r.dates||[]).map(v=>v==='L'?'末':v).join('・')+'日';
  if(r.type==='count')return (r.per==='month'?'月':'週')+r.n+'回';
  return '';
}
const SHIFT_TXT={none:'',prev:'（土日祝は前の平日へ）',next:'（土日祝は次の平日へ）',skip:'（土日祝はお休み）'};
function ruleLong(r){
  if(!r||r.type==='daily')return r&&r.skipOff?'毎日（土日祝を除く）':'毎日';
  if(r.type==='count')return (r.per==='month'?'月に':'週に')+r.n+'回（日は自由）';
  return ruleLabel(r)+(SHIFT_TXT[r.shift]||'');
}
function candidates(r,Y,M){ // M: 1-12
  const dim=new Date(Y,M,0).getDate(), out=[];
  if(r.type==='weekly'){
    const anc=r.interval===2?mondayOf(parseYmd(r.anchor)||new Date()):null;
    for(let d=1;d<=dim;d++){const dt=new Date(Y,M-1,d);if(!(r.wds||[]).includes(dt.getDay()))continue;
      if(anc){const wk=Math.round((mondayOf(dt)-anc)/6048e5);if(((wk%2)+2)%2!==0)continue;}
      out.push(dt);}
  }else if(r.type==='nth'){
    for(const w of (r.wds||[]))for(const n of (r.nths||[])){
      if(n==='L'){let d=dim;while(new Date(Y,M-1,d).getDay()!==w)d--;out.push(new Date(Y,M-1,d));}
      else{const first=1+((w-new Date(Y,M-1,1).getDay()+7)%7);const d=first+(n-1)*7;if(d<=dim)out.push(new Date(Y,M-1,d));}
    }
  }else if(r.type==='date'){
    for(const v of (r.dates||[])){const d=v==='L'?dim:+v;if(d>=1&&d<=dim)out.push(new Date(Y,M-1,d));}
  }
  return out;
}
function schedSet(r,y,m){ // その月の実施日 Set(日) / null=毎日
  if(!r||r.type==='count')return null;
  if(r.type==='daily'){if(!r.skipOff)return null;const S=new Set(),dim=new Date(y,m,0).getDate();for(let d=1;d<=dim;d++)if(isBiz(new Date(y,m-1,d)))S.add(d);return S;}
  const S=new Set();
  for(const off of [-1,0,1]){
    const t=new Date(y,m-1+off,1),Y=t.getFullYear(),M=t.getMonth()+1;
    for(let dt of candidates(r,Y,M)){
      if(!isBiz(dt)&&r.shift&&r.shift!=='none'){
        if(r.shift==='skip')continue;
        const step=r.shift==='prev'?-1:1;dt=new Date(dt);do{dt.setDate(dt.getDate()+step);}while(!isBiz(dt));
      }
      if(dt.getFullYear()===y&&dt.getMonth()+1===m)S.add(dt.getDate());
    }
  }
  return S;
}
let planCache={};
function createdOf(it){
  if(it.created)return it.created;
  const mm=/^i([0-9a-z]{8})/.exec(it.id||'');if(mm){const t=parseInt(mm[1],36);if(t>1.6e12&&t<4e12)return ymd(new Date(t));}
  return '';
}
function planView(it,y,m,info,ck){
  const r=it.rule, state={}, sched={}, since=createdOf(it);
  const before=d=>since&&(y+'-'+pad(m)+'-'+pad(d))<since;
  let done=0,target=0,tip='';
  if(r&&r.type==='count'){
    const n=Math.max(1,+r.n||1), groups={};
    for(const c of info){const key=r.per==='month'?'m':ymd(mondayOf(new Date(y,m-1,c.d)));(groups[key]=groups[key]||[]).push(c);}
    for(const key in groups){
      const g=groups[key], cnt=g.filter(c=>ck[c.d]).length, started=g.some(c=>!c.future);
      g.forEach(c=>{sched[c.d]=!!ck[c.d];if(cnt>=n&&!ck[c.d])state[c.d]='rest';});
      if((started||r.per==='month')&&!(since&&g.every(c=>before(c.d)))){done+=Math.min(cnt,n);target+=n;}
    }
    tip=ruleLong(r);
  }else{
    const S=schedSet(r,y,m);
    let all=0;
    for(const c of info){
      const s=S?S.has(c.d):true;sched[c.d]=s;
      if(!s){state[c.d]='rest';continue;}
      all++;
      if(!c.future&&!before(c.d)){target++;if(ck[c.d])done++;else if(!c.today)state[c.d]='miss';}
      else if(before(c.d)&&ck[c.d])done++;
    }
    if(!target)target=all;
    tip=ruleLong(r)+'：今月'+all+'回';
  }
  planCache[it.id]={sched};
  return {state,done,target,statTip:tip};
}

/* ルール設定パネル */
let ruleItem=null;
function rv(name){const el=document.querySelector('#rulePanel input[name="'+name+'"]:checked');return el?el.value:null;}
function rvs(name){return [...document.querySelectorAll('#rulePanel input[name="'+name+'"]:checked')].map(e=>e.value);}
function setChecks(name,vals){document.querySelectorAll('#rulePanel input[name="'+name+'"]').forEach(e=>{e.checked=vals.map(String).includes(e.value);});}
function readRule(){
  const t=rv('rType');
  if(t==='daily')return {type:'daily',skipOff:$('rSkip').checked};
  if(t==='weekly')return {type:'weekly',wds:rvs('rWd').map(Number),interval:+rv('rInt'),anchor:$('rAnchor').value,shift:$('rShift').value};
  if(t==='nth')return {type:'nth',nths:rvs('rNth').map(v=>v==='L'?'L':+v),wds:rvs('rWd2').map(Number),shift:$('rShift').value};
  if(t==='date')return {type:'date',dates:rvs('rDate').map(v=>v==='L'?'L':+v),shift:$('rShift').value};
  return {type:'count',n:Math.max(1,Math.min(31,+$('rN').value||1)),per:rv('rPer')};
}
function syncRuleUI(){
  const t=rv('rType');
  document.querySelectorAll('#rulePanel [data-sec]').forEach(el=>{el.hidden=!el.dataset.sec.split(' ').includes(t);});
  $('rAnchorRow').hidden=!(t==='weekly'&&rv('rInt')==='2');
  const r=readRule(), {y,m}=view;
  let txt='';
  if(r.type==='count')txt=ruleLong(r)+'。回数に届いたら、その'+(r.per==='month'?'月':'週')+'の残りの日は空欄になります。';
  else{
    const S=schedSet(r,y,m);
    if(!S)txt=m+'月：毎日';
    else{const a=[...S].sort((p,q)=>p-q);txt=a.length?m+'月の予定：'+a.map(d=>d+'日('+WDN[new Date(y,m-1,d).getDay()]+')').join('、'):m+'月の予定：なし';}
  }
  $('rPrev').textContent=txt;
  const bad=(r.type==='weekly'&&!r.wds.length)||(r.type==='nth'&&(!r.wds.length||!r.nths.length))||(r.type==='date'&&!r.dates.length);
  $('rSave').disabled=bad;
}
function openRule(it){
  ruleItem=it;const r=it.rule||{type:'daily'};
  document.querySelectorAll('#rulePanel input[name="rType"]').forEach(e=>{e.checked=e.value===r.type;});
  $('rSkip').checked=!!(r.type==='daily'&&r.skipOff);
  setChecks('rWd',r.type==='weekly'?r.wds:[1]);
  setChecks('rInt',[r.type==='weekly'&&r.interval===2?2:1]);
  $('rAnchor').value=r.type==='weekly'&&r.anchor?r.anchor:ymd(mondayOf(new Date()));
  setChecks('rNth',r.type==='nth'?r.nths:[1,3]);
  setChecks('rWd2',r.type==='nth'?r.wds:[1]);
  setChecks('rDate',r.type==='date'?r.dates:[1,15]);
  $('rN').value=r.type==='count'?r.n:2;
  setChecks('rPer',[r.type==='count'?r.per:'week']);
  $('rShift').value=r.shift||'none';
  $('rTitle').textContent='「'+it.name+'」をやる日';
  syncRuleUI();
  $('evBack').hidden=false;$('rulePanel').hidden=false;
  document.querySelector('#rulePanel input[name="rType"]:checked').focus();
}
function closeRule(){$('rulePanel').hidden=true;$('evBack').hidden=true;ruleItem=null;render();}

/* ---------- セール期間 ---------- */
const EV_NAME={ss:'SS',marathon:'マラソン'};
const evName=e=>e.type==='other'?(e.label||'イベント'):EV_NAME[e.type]||'イベント';
const evColor=e=>'var(--ev-'+(EV_NAME[e.type]?e.type:'other')+')';
function fmtDT(v){const d=+v.slice(8,10),mo=+v.slice(5,7),hh=+v.slice(11,13),mm=v.slice(14,16);return mo+'/'+d+' '+hh+':'+mm;}
function eventRows(y,m,days,info){
  const ms=y+'-'+pad(m)+'-01T00:00', me=y+'-'+pad(m)+'-'+pad(days)+'T23:59';
  const list=events.filter(e=>e.start<=me&&e.end>=ms).map(e=>({e,sd:e.start<ms?1:+e.start.slice(8,10),ed:e.end>me?days:+e.end.slice(8,10)}))
    .filter(x=>x.ed>=x.sd).sort((a,b)=>a.sd-b.sd||b.ed-a.ed);
  if(!list.length&&!editing)return '';
  const lanes=[];
  for(const x of list){let l=lanes.findIndex(L=>L[L.length-1].ed<x.sd);if(l<0){lanes.push([]);l=lanes.length-1;}lanes[l].push(x);}
  if(!lanes.length)lanes.push([]);
  let h='';
  lanes.forEach((L,li)=>{
    h+='<tr class="evrow"><th class="catcol"></th><th class="namecol">'+(li===0&&editing?'<button class="addlink evadd" data-evact="new">'+PLUS+'セール期間</button>':'')+'</th>';
    let d=1;
    for(const x of L){
      for(;d<x.sd;d++)h+='<th></th>';
      const span=x.ed-x.sd+1, name=evName(x.e), tip=name+'  '+fmtDT(x.e.start)+' 〜 '+fmtDT(x.e.end);
      h+='<th colspan="'+span+'"><button type="button" class="evbar" style="--evc:'+evColor(x.e)+'" data-evid="'+x.e.id+'" title="'+esc(tip)+'" aria-label="'+esc(tip)+'">'+esc(name)+
        (span>=5?'<small>'+esc(fmtDT(x.e.start))+'〜'+esc(fmtDT(x.e.end))+'</small>':'')+'</button></th>';
      d=x.ed+1;
    }
    for(;d<=days;d++)h+='<th></th>';
    h+='<th class="stat"></th></tr>';
  });
  return h;
}
let evEditing=null;
function evType(){return document.querySelector('input[name="evType"]:checked').value;}
function openEvent(ev){
  evEditing=ev||null;
  const {y,m}=view;
  const t=ev?ev.type:'ss';
  document.querySelectorAll('input[name="evType"]').forEach(r=>{r.checked=r.value===t;});
  $('evLabel').value=ev?ev.label:'';$('evLabel').hidden=t!=='other';
  $('evStart').value=ev?ev.start:y+'-'+pad(m)+'-04T20:00';
  $('evEnd').value=ev?ev.end:y+'-'+pad(m)+'-11T01:59';
  $('evTitle').textContent=ev?'セール期間を変更':'セール期間を追加';
  $('evDel').hidden=!ev;delete $('evDel').dataset.confirm;$('evDel').textContent='削除';
  $('evErr').hidden=true;
  $('evBack').hidden=false;$('evPanel').hidden=false;
  document.querySelector('input[name="evType"]:checked').focus();
}
function closeEvent(){$('evBack').hidden=true;$('evPanel').hidden=true;evEditing=null;render();}
document.querySelectorAll('input[name="evType"]').forEach(r=>r.addEventListener('change',()=>{$('evLabel').hidden=evType()!=='other';if(evType()==='other')$('evLabel').focus();}));
$('evPanel').addEventListener('submit',e=>{
  e.preventDefault();
  const type=evType(), label=$('evLabel').value.trim(), start=$('evStart').value, end=$('evEnd').value;
  const err=msg=>{$('evErr').textContent=msg;$('evErr').hidden=false;};
  if(!start||!end)return err('開始と終了の日時を入れてください');
  if(end<=start)return err('終了は開始より後にしてください');
  if(type==='other'&&!label)return err('表示名を入れてください');
  const ev=evEditing||{id:newId('e')};
  Object.assign(ev,{type,label:type==='other'?label:'',start,end});
  if(!evEditing)events.push(ev);
  saveDoc('events',ev);closeEvent();
});
$('evCancel').addEventListener('click',closeEvent);
$('evBack').addEventListener('click',()=>{if(!$('rulePanel').hidden)closeRule();else closeEvent();});
$('rulePanel').addEventListener('input',syncRuleUI);
$('rulePanel').addEventListener('change',syncRuleUI);
$('rulePanel').addEventListener('submit',e=>{
  e.preventDefault();if(!ruleItem)return;
  const r=readRule();ruleItem.rule=r.type==='daily'&&!r.skipOff?null:r;
  saveDoc('items',ruleItem);closeRule();
});
$('rCancel').addEventListener('click',closeRule);
$('rulePanel').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeRule();}});

$('evPanel').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeEvent();}});
$('evDel').addEventListener('click',()=>{
  const b=$('evDel');
  if(!b.dataset.confirm){b.dataset.confirm='1';b.textContent='本当に削除';return;}
  if(evEditing){events=events.filter(x=>x!==evEditing);removeDoc('events',evEditing.id);}
  closeEvent();
});
$('box').addEventListener('click',e=>{
  const a=e.target.closest('[data-evact="new"]');if(a){openEvent(null);return;}
  const b=e.target.closest('.evbar');if(!b||!editing)return;
  const ev=events.find(x=>x.id===b.dataset.evid);if(ev)openEvent(ev);
});

/* ---------- 起動 ---------- */
render();scrollToToday();
function startLocal(){
  local=true;const s=lsRead();items=s.items;cats=s.cats;events=s.events;status('この端末のブラウザに保存しています');loadMonth();scrollToToday();
}
(async()=>{
  let ns=null;
  try{ns=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){ns=null;}
  if(!ns){startLocal();return;}
  db=ns;status('同期しています');
  let first=true;
  db.collection('items').onSnapshot(s=>{
    items=s.docs.map(d=>{const x=d.data();return {id:d.id,name:String(x.name||''),url:String(x.url||''),cat:String(x.cat||''),order:Number(x.order)||0,rule:x.rule&&typeof x.rule==='object'?x.rule:null,created:String(x.created||'')};});
    safeRender();if(first){first=false;scrollToToday();}
  },e=>status('同期が止まりました。再読み込みしてください'));
  db.collection('events').onSnapshot(s=>{
    events=s.docs.map(d=>{const x=d.data();return {id:d.id,type:String(x.type||'other'),label:String(x.label||''),start:String(x.start||''),end:String(x.end||'')};}).filter(e=>e.start&&e.end);
    if(!$('evPanel').hidden)return; safeRender();
  },e=>status('同期が止まりました。再読み込みしてください'));
  db.collection('cats').onSnapshot(s=>{
    cats=s.docs.map(d=>{const x=d.data();return {id:d.id,name:String(x.name||''),order:Number(x.order)||0,hue:Number.isInteger(x.hue)?x.hue:null};});
    safeRender();
  },e=>status('同期が止まりました。再読み込みしてください'));
  loadMonth();
})();
})();
